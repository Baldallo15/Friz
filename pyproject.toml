[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "friz"
version = "1.2.3"
description = "Universal Multi-Downloader with cyberpunk UI"
authors = [{name = "Baldallo15"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "yt-dlp>=2025.1.1,<2026.0.0",
    "spotdl>=4.2.0,<5.0.0",
    "rich>=13.7.0,<14.0.0",
    "pydantic>=1.10.0,<2.0.0",
]
